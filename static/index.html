<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Cpath fill='%236b8e55' d='m8,17v-5.6l-3.94,3.96c-.39.39-1.02.39-1.42,0h0c-.39-.4-.39-1.03,0-1.42l3.96-3.94H1c-.55,0-1-.45-1-1h0c0-.55.45-1,1-1h5.6l-3.96-3.94c-.39-.39-.39-1.02,0-1.42h0c.39-.4,1.03-.4,1.42,0l3.94,3.96V1c0-.55.45-1,1-1h0c.55,0,1,.45,1,1v5.6l3.94-3.96c.39-.39,1.02-.39,1.42,0h0c.39.4.39,1.03,0,1.42l-3.96,3.94h5.6c.55,0,1,.45,1,1h0c0,.55-.45,1-1,1h-5.6l3.96,3.94c.39.39.39,1.02,0,1.42h0c-.39.4-1.03.4-1.42,0l-3.94-3.96v5.6c0,.55-.45,1-1,1h0c-.55,0-1-.45-1-1Z'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <span class="app-title">AI Assistant</span>
        <button type="button" id="sidebar-toggle" class="sidebar-toggle" title="Collapse sidebar" aria-label="Collapse sidebar">&#171;</button>
      </div>

      <button type="button" id="new-chat-btn" class="new-chat-btn">New Chat</button>

      <div class="sidebar-section">
        <h2 class="sidebar-heading">Chat history</h2>
        <div id="thread-list" class="thread-list"></div>
      </div>
    </aside>

    <a href="#" id="sidebar-expand" class="sidebar-expand" title="Expand sidebar" aria-label="Expand sidebar" hidden>&#187;</a>

    <main class="chat-area">
      <header class="brand" id="brand" hidden>
        <svg class="brand-logo" viewBox="0 0 18 18" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <path fill="#6b8e55" d="m8,17v-5.6l-3.94,3.96c-.39.39-1.02.39-1.42,0h0c-.39-.4-.39-1.03,0-1.42l3.96-3.94H1c-.55,0-1-.45-1-1h0c0-.55.45-1,1-1h5.6l-3.96-3.94c-.39-.39-.39-1.02,0-1.42h0c.39-.4,1.03-.4,1.42,0l3.94,3.96V1c0-.55.45-1,1-1h0c.55,0,1,.45,1,1v5.6l3.94-3.96c.39-.39,1.02-.39,1.42,0h0c.39.4.39,1.03,0,1.42l-3.96,3.94h5.6c.55,0,1,.45,1,1h0c0,.55-.45,1-1,1h-5.6l3.96,3.94c.39.39.39,1.02,0,1.42h0c-.39.4-1.03.4-1.42,0l-3.94-3.96v5.6c0,.55-.45,1-1,1h0c-.55,0-1-.45-1-1Z"/>
        </svg>
        <span class="brand-title">Personal AI Assistant</span>
      </header>

      <div id="messages" class="messages">
        <div id="empty-state" class="empty-state">
          <svg class="logo-mark" viewBox="0 0 18 18" width="80" height="80" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path fill="#6b8e55" d="m8,17v-5.6l-3.94,3.96c-.39.39-1.02.39-1.42,0h0c-.39-.4-.39-1.03,0-1.42l3.96-3.94H1c-.55,0-1-.45-1-1h0c0-.55.45-1,1-1h5.6l-3.96-3.94c-.39-.39-.39-1.02,0-1.42h0c.39-.4,1.03-.4,1.42,0l3.94,3.96V1c0-.55.45-1,1-1h0c.55,0,1,.45,1,1v5.6l3.94-3.96c.39-.39,1.02-.39,1.42,0h0c.39.4.39,1.03,0,1.42l-3.96,3.94h5.6c.55,0,1,.45,1,1h0c0,.55-.45,1-1,1h-5.6l3.96,3.94c.39.39.39,1.02,0,1.42h0c-.39.4-1.03.4-1.42,0l-3.94-3.96v5.6c0,.55-.45,1-1,1h0c-.55,0-1-.45-1-1Z"/>
          </svg>
          <h1 class="hero-title">Personal AI Assistant</h1>
          <p class="hero-subtitle">Hi, What's your agenda today?</p>
        </div>
        <div id="messages-inner" class="messages-inner"></div>
      </div>

      <div class="composer-wrap">
        <div id="attach-chips" class="attach-chips"></div>
        <form id="chat-form" class="composer" autocomplete="off">
          <button type="button" id="attach-btn" class="composer-icon" title="Attach documents" aria-label="Attach documents">+</button>
          <input type="file" id="file-input" multiple accept=".pdf,.docx,.txt,.md" hidden />
          <input type="text" id="chat-input" placeholder="Type here" autocomplete="off" />
          <button type="submit" id="send-btn" class="send-btn" title="Send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M12 4l7 8h-4v8h-6v-8H5l7-8z" fill="currentColor" />
            </svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
